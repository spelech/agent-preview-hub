name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  gate1-release-and-integrity:
    name: "Gate 1: Release & Anti-Test-Theatre Integrity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Release, LOC Bounds & Anti-Test-Theatre
        run: python3 verify_release.py

  gate2-build-and-test:
    name: "Gate 2: Build, Lint & Pytest (>=80% Coverage)"
    needs: gate1-release-and-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Ruff Linter
        run: ruff check src/ tests/
      - name: Run Pytest with Coverage Gate
        run: pytest --cov=agent_preview_hub --cov-fail-under=80

  gate3-live-smoke:
    name: "Gate 3: Live FastAPI & CLI Smoke Gate"
    needs: gate2-build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Live Server & CLI Smoke Verification
        run: |
          mkdir -p /tmp/smoke-previews
          agent-preview --dir /tmp/smoke-previews serve --host 127.0.0.1 --port 18033 &
          SRV_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18033/health >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18033/health | grep '"status":"ok"'
          mermaid-live --dir /tmp/smoke-previews -s 'flowchart TD; A["Node <slug>"] --> B'
          kill $SRV_PID || true
